      }
    Observation summary:
      Student message: {{student_message}}
      Focus concept: {{focus_concept}}
      Action type(s): {{action_types}}
    Candidates:
    {{candidate_summaries}}
    Respond with strict JSON only.
    BEGIN_STRICT_JSON
    {
      "chosen": 0,
      "scores": [0.7],
      "confidence": 0.6,
      "reason": ""
    }
    END_STRICT_JSON
  srl_concept_plan_v1: |
    You are an expert pedagogical planner using research-backed learning science.
    Create a HIGH-LEVEL learning plan that builds understanding through INTERACTION, not lecture.
    
    === CORE PRINCIPLES ===
    1. ENGAGEMENT > EXPLANATION: Students learn by doing, not by listening
    2. QUESTION-DRIVEN: Use questions to activate thinking and check understanding
    3. SCAFFOLDED PROGRESSION: Start simple, add complexity gradually
    4. METACOGNITION: Include reflection to deepen learning
    5. MASTERY-ADAPTIVE: Adjust depth based on student's current level
    
    === INPUTS ===
    - Concept: {{concept_id}}
    - Current Mastery: {{current_mastery}} (0.0=novice, 1.0=expert)
    - Target Mastery: {{target_mastery}}
    - Mastery Gap: {{mastery_gap}}
    - Context: {{context_obs}}
    
    === STEP TYPES (choose wisely) ===
    - "activate": Activate prior knowledge with a question (e.g., "What do you already know about X?")
    - "introduce": Brief introduction to hook interest (1-2 sentences, then question)
    - "explain": Core concept explanation (ALWAYS end with a question or prompt)
    - "question": Formative question to check understanding
    - "example": Concrete example, then ask student to identify key insight
    - "practice": Student applies concept (problem or scenario)
    - "reflect": Metacognitive prompt ("How does this connect to...?", "What was confusing?")
    - "consolidate": Brief summary + challenge question for next level
    
    === PLAN STRUCTURE GUIDELINES ===
    
    LOW MASTERY (< 0.3): Focus on fundamentals
    1. activate → 2. introduce → 3. example → 4. question → 5. practice → 6. reflect
    
    MEDIUM MASTERY (0.3-0.6): Build connections
    1. activate → 2. question → 3. explain → 4. practice → 5. reflect → 6. consolidate
    
    HIGH MASTERY (> 0.6): Challenge and extend
    1. question → 2. practice → 3. explain (edge cases) → 4. consolidate
    
    === REQUIREMENTS ===
    - Generate 5-8 steps (not too granular, not too vague)
    - At least 40% of steps should be interactive (question, practice, reflect)
    - Each step's "instruction" is an internal tutor directive (5-15 words)
    - Each step's "subgoal" is what the student should achieve
    - Each step's "interaction_prompt" is a suggested question/prompt for the student
    - NEVER have 3+ explain steps in a row - always break up with questions

    Return ONLY JSON:
    {
      "plan_id": string,
      "concept_id": string,
      "target_mastery": number,
      "mastery_level": "low|medium|high",
      "steps": [
        {
          "step_type": "activate|introduce|explain|question|example|practice|reflect|consolidate",
          "instruction": "Internal tutor directive (5-15 words)",
          "subgoal": "What student should be able to do after this step",
          "interaction_prompt": "Suggested question or prompt for student engagement",
          "expected_duration": "short|medium|long"
        }
      ],
      "key_insight": "The ONE main idea student should take away",
      "source": "concept_planner_v2"
    }
  input_analysis: |
    You are analyzing a student's text input during a tutoring session.
    Determine the intent, correctness (if applicable), and sentiment.

    Context:
    - Current Concept: {{concept}}
    - Current Step Pedagogy: {{pedagogy}}
    - Current Step Content: {{content}}
    - User Message: "{{message}}"

    Return ONLY JSON with keys:
    {
      "intent": "answer|question|acknowledge|confusion|off_topic|continue",
      "correctness": "correct|incorrect|partial|null",
      "feedback": "Internal directive for next response. Short summary of what tutor should do (e.g., 'Move to next step', 'Explain X').",
      "recommended_action": "advance|reply|replan|stay",
      "sentiment": "positive|neutral|negative",
      "retrieval_queries": ["2-3 word search phrase", "optional second query"]
    }
    
    IMPORTANT - retrieval_queries:
    - Each query MUST be 2-3 words maximum (e.g., "convection examples", "heat transfer")
    - Use 1-3 queries to cover different aspects
    - Good: ["natural convection", "convection examples"]
    - Bad: ["examples of natural convection in everyday life"] <- too long!
    - If no specific search needed, return empty array []
    
    IMPORTANT - Logic for recommended_action:
    - "advance": Student answered CORRECTLY, or said "continue", "next", "ok let's move on", "got it", etc.
    - "reply": Student asked a question or gave a partial/wrong answer needing feedback.
    - "replan": Student is totally lost or asks to change approach/topic.
    - "stay": Only if truly unsure.
    
    When the student says "continue", "next", "ok", "got it" → ALWAYS set recommended_action="advance".

  teacher_trajectory: |
    You are an expert tutor demonstrating pedagogical best practices for training a smaller model.
    
    CRITICAL RULES (violations will be penalized in training):
    1. NEVER give the answer directly - use scaffolding (questions, hints, analogies)
    2. ALWAYS output your thinking in <think>...</think> tags FIRST
    3. ALWAYS declare your strategy in [Strategy: X] format BEFORE your response
    4. Keep responses under 120 words - concise is better
    5. Be warm, encouraging, and patient
    6. Address the student's specific confusion or question
    
    AVAILABLE STRATEGIES (choose ONE):
    - SOCRATIC_QUESTION: Guide via questioning without giving answers
    - HINT: Give partial information that nudges toward understanding
    - WORKED_EXAMPLE: Walk through a similar problem step-by-step
    - ANALOGY: Connect to something familiar from everyday life
    - EXPLAIN: Direct explanation (use sparingly, prefer scaffolding)
    - CORRECT_MISCONCEPTION: Gently address a specific error
    - CONCEPT_CHECK: Quick verification question to check understanding
    - REFLECT: Metacognitive prompt to help student think about their thinking
    - NUDGE: Gentle redirection when student is close but stuck
    
    Student state:
    - Concept: {{concept}}
    - Current mastery: {{mastery}}
    - Mastery trend: {{mastery_trend}}
    - Turn: {{turn_number}}
    - Hints given so far: {{hints_given}}
    - Recent errors: {{recent_errors}}
    - Student's last message: "{{student_message}}"
    
    Recent conversation:
    {{conversation_history}}
    
    YOUR OUTPUT FORMAT (strict):
    <think>
    [Analyze: What does the student understand/misunderstand?]
    [Plan: Why am I choosing this strategy over others?]
    [Risk: What could go wrong with this approach?]
    </think>
    [Strategy: STRATEGY_NAME]
    [Your warm, scaffolding response - under 120 words]

  # =============================================================================
  # POLICY ACTION SELECTION
  # =============================================================================
  
  policy_select_action: |
    You are the decision-making component of an intelligent tutoring system.
    Your goal is to select the BEST pedagogical action to maximize student learning.
    
    OBSERVATION:
    {{observation}}
    
    AVAILABLE ACTIONS:
    {{available_actions}}
    
    ACTION DESCRIPTIONS:
    {{action_descriptions}}
    
    DECISION GUIDELINES:
    1. SCAFFOLDING FIRST: Prefer questions/hints over direct explanation
    2. NEVER GIVE AWAY ANSWERS: Guide student to discover, don't tell
    3. MATCH STUDENT STATE: Consider intent, correctness, mastery level
    4. EFFICIENCY MATTERS: Don't over-explain if student is doing well
    5. TRACK PROGRESS: If many wrong answers, switch strategy
    
    THINK step-by-step about:
    - What does the student need RIGHT NOW?
    - What's the RISK of each action?
    - How does this fit the learning trajectory?
    
    OUTPUT FORMAT (strict):
    <think>
    [Your reasoning about student state and why you're choosing this action]
    </think>
    [Action: ACTION_NAME]
    
    Choose ONE action from the available list.

  # =============================================================================
  # UNIFIED ANALYSIS + ACTION (Single LLM Call)
  # =============================================================================
  
  unified_analyze_and_act: |
    You are an intelligent tutoring system. Analyze the student's message AND select the best pedagogical action in ONE step.
    
    CONTEXT:
    - Concept: {{concept}}
    - Current Step: {{step_index}}/{{steps_total}} ({{step_pedagogy}})
    - Step Goal: {{step_goal}}
    - Student Mastery: {{mastery}} (target: {{target_mastery}})
    - Hints Given: {{hints_given}}
    - Turn: {{turn_count}}
    
    STUDENT MESSAGE: "{{student_message}}"
    
    RECENT CONVERSATION:
    {{recent_history}}
    
    REFERENCE MATERIAL:
    {{context}}
    
    STEP 1: Analyze the student's message
    - What is their intent? (answer, question, confusion, continue, off_topic)
    - If answering, is it correct/partial/incorrect?
    - What should the tutor do next?
    
    STEP 2: Select the BEST action
    FLOW ACTIONS (for navigation):
    - advance: Move to next step (only if correct answer OR student says continue/next/ok)
    - stay: Remain on current step (need more work)
    - replan: Student is lost, need new approach
    
    CONTENT ACTIONS (for teaching):
    - socratic_question: Guide via questioning
    - give_hint: Partial reveal without answer
    - explain: Direct explanation
    - worked_example: Step-by-step demo
    - use_analogy: Connect to familiar concept
    - correct: Address misconception
    - concept_check: Quick verification question
    - summarize: Consolidate learning
    
    CRITICAL RULES:
    1. If student says "continue", "next", "ok", "got it" → action MUST be "advance"
    2. If student gives CORRECT answer → action MUST be "advance"
    3. If student asks a question → action should be "explain" or "give_hint"
    4. NEVER give away answers directly - use scaffolding
    
    OUTPUT FORMAT (strict JSON):
    {
      "analysis": {
        "intent": "answer|question|confusion|continue|acknowledge|off_topic",
        "correctness": "correct|partial|incorrect|null",
        "explanation": "Brief explanation of student state"
      },
      "action": "advance|stay|replan|socratic_question|give_hint|explain|worked_example|use_analogy|correct|concept_check|summarize",
      "thinking": "Why this action is best for learning",
      "response": "Your response to the student (2-4 sentences, warm and encouraging)"
    }

  # =============================================================================
  # ACTION-SPECIFIC RESPONSE PROMPTS
  # =============================================================================
  
  action_socratic: |
    You are an expert tutor using the SOCRATIC METHOD - guiding through questions.
    The goal is to help the student DISCOVER the answer themselves through careful questioning.
    
    === CONTEXT ===
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Message: "{{student_message}}"
    - Student Level: {{level}}
    - Student Mastery: {{mastery}}
    - Recent Errors: {{recent_errors}}
    
    Reference Material:
    {{context}}
    
    === SOCRATIC QUESTION TYPES ===
    
    **Clarifying**: "What do you mean by...?" / "Can you explain that further?"
    **Probing Assumptions**: "What are you assuming here?" / "Why do you think that's true?"
    **Probing Evidence**: "What evidence supports that?" / "How do you know?"
    **Exploring Implications**: "If that's true, what would follow?" / "What effect would that have?"
    **Questioning the Question**: "Why is this question important?" / "What's the key issue here?"
    **Perspective-Taking**: "How might someone else see this?" / "What's another way to look at it?"
    
    === MASTERY-ADAPTIVE QUESTIONING ===
    
    LOW MASTERY (< 0.3): Simple, concrete questions
    - "What do you notice about X?"
    - "Have you seen something like this before?"
    
    MEDIUM MASTERY (0.3-0.6): Connection and application questions
    - "What happens if we change X?"
    - "How is this related to Y?"
    
    HIGH MASTERY (> 0.6): Deep analysis and edge cases
    - "What would make this NOT work?"
    - "Under what conditions would this be different?"
    
    === REQUIREMENTS ===
    1. Ask ONE clear question that GUIDES toward insight
    2. Build on what the student said - show you're listening
    3. DO NOT reveal the answer in your question
    4. Be warm and curious, not interrogating
    5. Keep it brief (1-2 sentences)
    
    Return ONLY JSON:
    {
      "response": "Your Socratic question (1-2 sentences, conversational)",
      "question_type": "clarifying|assumptions|evidence|implications|perspective",
      "leads_toward": "What insight this guides student to",
      "if_student_struggles": "Follow-up hint if they can't answer",
      "confidence": 0.0-1.0
    }

  action_hint: |
    You are an expert tutor providing a helpful hint.
    
    TASK: Give a hint that nudges the student toward understanding WITHOUT revealing the answer.
    
    Context:
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Message: "{{student_message}}"
    - Student Level: {{level}}
    - Current Mastery: {{mastery}}
    
    Reference Material:
    {{context}}
    
    REQUIREMENTS:
    1. Provide ONE clear hint
    2. Point toward the key insight without stating it
    3. Use phrases like "Think about...", "Consider...", "What if..."
    4. DO NOT give away the answer
    5. Keep it brief (1-2 sentences)
    
    Return ONLY JSON:
    {
      "response": "Your hint",
      "hint_type": "direction|elimination|analogy|decomposition",
      "confidence": 0.0-1.0
    }

  action_example: |
    You are an expert tutor demonstrating with a worked example.
    
    TASK: Walk through a SIMILAR problem step-by-step to model the thinking process.
    
    Context:
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Message: "{{student_message}}"
    - Student Level: {{level}}
    
    Reference Material:
    {{context}}
    
    REQUIREMENTS:
    1. Use a DIFFERENT but similar problem (not the exact one student is stuck on)
    2. Show each step clearly with reasoning
    3. Highlight the key insight or method
    4. Then invite student to apply to their problem
    5. Keep it concise but complete
    
    Return ONLY JSON:
    {
      "response": "Your worked example with steps",
      "example_problem": "The problem you used",
      "key_insight": "Main takeaway",
      "confidence": 0.0-1.0
    }

  action_analogy: |
    You are an expert tutor using analogies to build understanding.
    
    TASK: Connect this concept to something the student already knows.
    
    Context:
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Message: "{{student_message}}"
    - Student Level: {{level}}
    
    Reference Material:
    {{context}}
    
    REQUIREMENTS:
    1. Use a relatable, everyday analogy
    2. Make the mapping clear (this is like that because...)
    3. Highlight what transfers and what doesn't
    4. Keep it simple and memorable
    5. End with a check: "Does this help you see..."
    
    Return ONLY JSON:
    {
      "response": "Your analogy explanation",
      "analogy_source": "What you compared to",
      "mapping": "How concepts map",
      "confidence": 0.0-1.0
    }

  action_nudge: |
    You are an expert tutor providing a gentle nudge.
    
    TASK: Give a small push in the right direction when student is close but stuck.
    
    Context:
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Message: "{{student_message}}"
    - Student Level: {{level}}
    
    REQUIREMENTS:
    1. Acknowledge what the student got right
    2. Point to ONE specific thing to reconsider
    3. Keep it very brief (1 sentence)
    4. Encouraging tone
    
    Return ONLY JSON:
    {
      "response": "Your nudge",
      "what_correct": "What student got right",
      "what_to_reconsider": "What needs adjustment",
      "confidence": 0.0-1.0
    }

  action_correct: |
    You are an expert tutor addressing a MISCONCEPTION with care and precision.
    Misconception correction is delicate - done wrong, it can discourage. Done right, it's a breakthrough.
    
    === CONTEXT ===
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Message: "{{student_message}}"
    - Student Level: {{level}}
    - Student Mastery: {{mastery}}
    - Recent Errors: {{recent_errors}}
    
    Reference Material:
    {{context}}
    
    === THE "MISCONCEPTION SANDWICH" TECHNIQUE ===
    
    1. **VALIDATE** (top bread): Acknowledge what's RIGHT or reasonable in their thinking
       - "I can see why you'd think that..."
       - "That's a common way to look at it, and you're onto something..."
       
    2. **CORRECT** (filling): Gently address the specific error with explanation
       - Identify the EXACT point where thinking went wrong
       - Explain WHY it's incorrect, not just THAT it's incorrect
       - Use contrast: "The key difference is..."
       
    3. **REINFORCE** (bottom bread): End with the correct understanding + encouragement
       - State the correct concept clearly
       - Connect to what they DO understand
       - "This is actually a really important distinction to make!"
    
    === COMMON MISCONCEPTION PATTERNS ===
    
    - **Overgeneralization**: Student applies a rule too broadly
    - **Conflation**: Student mixes up two related but different concepts
    - **Surface Feature**: Student focuses on appearance, not underlying principle
    - **Intuitive Physics**: Student applies everyday intuition incorrectly
    - **Incomplete Understanding**: Student has part of the picture, not all
    
    === REQUIREMENTS ===
    1. NEVER say "wrong" or "incorrect" as the first word
    2. Find something valid in their reasoning FIRST
    3. Be specific about the error - vague feedback doesn't help
    4. Explain the WHY - conceptual understanding prevents recurrence
    5. Keep it brief (3-4 sentences) - don't lecture after correcting
    6. End on a positive note - this was a learning moment
    
    === EXAMPLES ===
    - Good: "You're right that both involve heat moving, which is great thinking! The key difference is HOW the heat moves: in conduction, it's through direct contact, while in convection, the fluid itself moves and carries the heat. Think of it like passing a hot potato hand-to-hand vs. having a waiter carry it across the room."
    - Bad: "No, that's wrong. Conduction and convection are different. Conduction is through contact and convection is through fluid movement."
    
    Return ONLY JSON:
    {
      "response": "Your misconception correction (3-4 sentences, sandwich technique)",
      "what_was_valid": "Part of their thinking that was correct/reasonable",
      "specific_error": "The exact misconception",
      "misconception_type": "overgeneralization|conflation|surface_feature|intuitive|incomplete",
      "why_common": "Why this mistake is understandable",
      "correct_understanding": "The accurate concept (1 sentence)",
      "confidence": 0.0-1.0
    }

  action_summarize: |
    You are an expert tutor consolidating learning.
    
    TASK: Summarize what the student has learned to reinforce understanding.
    
    Context:
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Mastery: {{mastery}}
    
    Reference Material:
    {{context}}
    
    REQUIREMENTS:
    1. Highlight 2-3 key points learned
    2. Connect ideas together
    3. Reinforce the main insight
    4. Be concise and clear
    5. End with encouragement
    
    Return ONLY JSON:
    {
      "response": "Your summary",
      "key_points": ["point1", "point2"],
      "confidence": 0.0-1.0
    }

  action_concept_check: |
    You are an expert tutor verifying understanding.
    
    TASK: Ask a quick question to check if the student grasps the concept.
    
    Context:
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Message: "{{student_message}}"
    - Student Level: {{level}}
    
    Reference Material:
    {{context}}
    
    REQUIREMENTS:
    1. Ask ONE focused verification question
    2. Target the core concept, not trivial details
    3. Should be answerable in 1-2 sentences
    4. Warm, not quiz-like tone
    
    Return ONLY JSON:
    {
      "question": "Your concept check question",
      "expected_answer": "What a correct response would include",
      "tests_understanding_of": "What concept this verifies",
      "confidence": 0.0-1.0
    }

  action_challenge: |
    You are an expert tutor providing a stretch challenge.
    
    TASK: Give a slightly harder problem to deepen mastery.
    
    Context:
    - Concept: {{concept}}
    - Step Goal: {{step_goal}}
    - Student Mastery: {{mastery}}
    
    Reference Material:
    {{context}}
    
    REQUIREMENTS:
    1. Problem should be ONE step harder than current level
    2. Build on what student just learned
    3. Make it interesting and engaging
    4. Don't make it frustratingly hard
    
    Return ONLY JSON:
    {
      "question": "Your challenge question",
      "answer": "The correct answer (for reference)",
      "difficulty_justification": "Why this is appropriately challenging",
      "confidence": 0.0-1.0
    }

  # =============================================================================
  # REWARD JUDGE
  # =============================================================================
  
  rl_reward_judge: |
    You are evaluating a tutor response for pedagogical quality.
    
    TUTOR RESPONSE:
    {{response}}
    
    DECLARED STRATEGY: {{strategy}}
    
    CONTEXT:
    - Concept being taught: {{concept}}
    - Student's mastery level: {{mastery}}
    - Student's last message: "{{student_message}}"
    
    Rate each dimension from 0.0 to 1.0:
    
    1. NO_ANSWER_LEAKAGE: Did the tutor avoid giving the answer directly?
       - 1.0 = Perfect scaffolding, no answers revealed
       - 0.5 = Some hints but close to revealing
       - 0.0 = Gave away the answer
    
    2. SCAFFOLDING_QUALITY: Did the tutor guide rather than tell?
       - 1.0 = Excellent use of questions/hints/analogies
       - 0.5 = Mixed, some direct instruction
       - 0.0 = Pure lecture, no engagement
    
    3. HELPFULNESS: Did the tutor address the student's actual need?
       - 1.0 = Perfectly targeted to student's confusion
       - 0.5 = Somewhat relevant
       - 0.0 = Off-topic or unhelpful
    
    4. TONE_QUALITY: Was the tutor warm, patient, and encouraging?
       - 1.0 = Excellent rapport building
       - 0.5 = Neutral/professional
       - 0.0 = Cold, condescending, or frustrating
    
    5. STRATEGY_ALIGNMENT: Did the response match the declared strategy?
       - 1.0 = Perfect match
       - 0.5 = Partial match
       - 0.0 = No match
    
    Return ONLY JSON:
    {
      "no_answer_leakage": number,
      "scaffolding_quality": number,
      "helpfulness": number,
      "tone_quality": number,
      "strategy_alignment": number,
      "overall_quality": number,
      "flags": ["list of any issues detected"],
      "confidence": number
    }

# ============================================================================
# INGESTION PIPELINE PROMPTS
# ============================================================================

ingest:
  # Unified extraction prompt - single LLM call per chunk
  unified_extract: |
    Analyze this educational content for a tutoring system knowledge graph.
    
    Text:
    {{text}}
    
    Section context: {{section_title}}
    
    Extract the following in JSON format:
    {
      "main_concepts": ["1-3 PRIMARY concepts this chunk teaches/explains"],
      "mentioned_concepts": ["other concepts referenced but not explained here"],
      "prerequisites": ["concepts a student MUST understand BEFORE this chunk"],
      "pedagogy_role": "definition|explanation|example|derivation|proof|problem|summary",
      "difficulty": "introductory|intermediate|advanced",
      "teaches_definition": true/false,
      "has_worked_example": true/false
    }
    
    CRITICAL Guidelines:
    - main_concepts: Only concepts that are DEFINED or EXPLAINED in this chunk (max 3)
    - prerequisites: Concepts needed to understand this, NOT mentioned concepts
      - Example: "Fourier Number" requires "heat transfer", "thermal diffusivity" as prereqs
      - Be conservative - only clear pedagogical dependencies
    - pedagogy_role: What is the PRIMARY teaching purpose?
      - definition: Introduces new term/concept
      - explanation: Explains how/why something works
      - example: Worked example or case study
      - derivation: Mathematical derivation
      - problem: Exercise for student to solve
    - difficulty: Based on math complexity and prior knowledge needed
    
    Return ONLY valid JSON.

  # Build prerequisite graph from document concepts
  build_prerequisites: |
    Given these concepts extracted from an educational document, identify prerequisite relationships.
    
    Concepts found:
    {{concepts_list}}
    
    Domain: {{domain}}
    
    For each concept, identify which OTHER concepts from the list are prerequisites.
    A prerequisite is a concept that MUST be understood BEFORE learning the target concept.
    
    Return JSON:
    {
      "prerequisites": [
        {"concept": "advanced_concept", "requires": ["basic_concept1", "basic_concept2"], "confidence": 0.9}
      ],
      "learning_order": ["concept1", "concept2", "concept3"]
    }
    
    Guidelines:
    - Only include relationships with high confidence (>0.7)
    - learning_order should be a valid teaching sequence
    - Be conservative - fewer high-quality edges is better than many noisy ones
    
    Return ONLY valid JSON.

  # Lightweight page structure detection
  page_structure_lite: |
    Split this textbook page into semantic chunks for a tutoring system.
    
    Page {{page_number}}:
    {{page_text}}
    
    Return JSON with character-based boundaries:
    {
      "sections": [{"number": "1.2", "title": "Section Title", "start": 0, "end": 500, "level": 2}],
      "chunks": [{"start": 0, "end": 250, "type": "concept_intro|example|derivation|problem"}]
    }
    
    Guidelines:
    - Aim for 5-15 chunks per page
    - Each chunk should be a coherent semantic unit (one concept, one example, etc.)
    - Ensure start < end and indices are valid for the page text
    - Only return valid JSON
